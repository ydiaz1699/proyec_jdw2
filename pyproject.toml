[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jdownloader-mcp"
version = "1.1.0"
description = "MCP Server for full JDownloader remote control via My.JDownloader API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ydiaz1699" },
]
keywords = ["jdownloader", "mcp", "model-context-protocol", "download-manager", "automation"]

dependencies = [
    "myjdapi>=1.1.10",
    "mcp[cli]>=1.0.0",
    "requests>=2.28.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
]
ml = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
]
all = [
    "jdownloader-mcp[ocr,ml]",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
jdownloader-mcp = "jdownloader_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jdownloader_mcp"]
